services:
  source:
    image: nextgenhealthcare/connect:4.5.2
    environment:
      DATABASE: derby
      KEYSTORE_STOREPASS: changeit
      KEYSTORE_KEYPASS: changeit
      _MP_SERVER_STARTUPDEPLOY: 'false'
      # The image's default heap runs out importing a large configuration.
      VMOPTIONS: '-Xmx2g'
    ports:
      - '127.0.0.1::8443'
  target:
    image: nextgenhealthcare/connect:4.5.2
    environment:
      DATABASE: derby
      KEYSTORE_STOREPASS: changeit
      KEYSTORE_KEYPASS: changeit
      _MP_SERVER_STARTUPDEPLOY: 'false'
      # The image's default heap runs out importing a large configuration.
      VMOPTIONS: '-Xmx2g'
    ports:
      - '127.0.0.1::8443'
