# An isolated Mirth for testing channelvault against a REAL configuration.
#
#   docker compose -f docker-compose.isolated.yml up -d
#   # Administrator / API: https://localhost:8443 (admin / admin), this machine only
#   docker compose -f docker-compose.isolated.yml down   # deletes the server and its data
#
# A real config's channels would otherwise poll real databases, send to real
# endpoints and email real people once deployed. Three controls stop that:
#
# - Mirth sits only on an `internal` network, which has no route to the
#   internet, the LAN or the host. Deployed or not, nothing leaves.
# - server.startupdeploy=false, so a restart never deploys channels.
# - Port 8443 is published on 127.0.0.1 only, through a TCP forwarder (the
#   one container on both networks), so nothing else on the LAN can connect.
#
# No volume: the server's data (including the config's secrets) lives in the
# container and is deleted by `down`.
services:
  mirth:
    image: nextgenhealthcare/connect:4.5.2
    container_name: channelvault-isolated
    environment:
      - DATABASE=derby
      - KEYSTORE_STOREPASS=changeit
      - KEYSTORE_KEYPASS=changeit
      - _MP_SERVER_STARTUPDEPLOY=false
    networks:
      - isolated

  gateway:
    image: alpine/socat:latest
    container_name: channelvault-isolated-gateway
    command: tcp-listen:8443,fork,reuseaddr tcp-connect:mirth:8443
    ports:
      - '127.0.0.1:8443:8443'
    networks:
      - isolated
      - published
    depends_on:
      - mirth

networks:
  isolated:
    internal: true
  published: {}
